services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - DB_PATH=/data/spend.db
      - PORT=8080
      # OCR (receipt text extraction) — these have sane defaults baked into
      # the image already; uncomment only to override them.
      # - OCR_PROVIDER=tesseract   # tesseract | none
      # - OCR_LANG=eng             # tesseract language pack, e.g. "eng+fra"
      # - OCR_MAX_CONCURRENT=2     # how many receipts to process at once
      # Race Budget: miniBudget expense category used when a race cost is
      # sent over (created automatically on first use).
      # - RACE_BUDGET_CATEGORY=Races
    volumes:
      - spend-data:/data
    expose:
      - "8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

  # Race Budget: a second frontend on the same backend and database.
  frontend-race:
    build: ./frontend-race
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8082:80"

volumes:
  spend-data:
