services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - DB_PATH=/data/spend.db
      - PORT=8080
    volumes:
      - spend-data:/data
    expose:
      - "8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  spend-data:
